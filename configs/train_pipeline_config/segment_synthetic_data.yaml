builder: training_segmentation
cfg:
  pipeline:
    ModelBuilding:
      config:
        task: "MassNet"
        architecture_config: "configs/yamlconfig/MassNet/Chromosome_MassNet.yaml"
        save_folder: "outputs/training/susy"
        logging:
          log_input: True
          log_grad: True
        pretrained: 
          mode: train
          path: null
        is_validate: true

    InitTrainingHandler:
      is_init_distributed: true 
      config:
        device: 'cuda'
        optimizer:
          name: "AdamW"
          params:
            lr: 0.001
            betas: [0.9, 0.999]
            eps: 1e-8
            weight_decay: 0.01

        scheduler:
          name: "WarmupCosineLR"
          params:
            max_iter: 200
            eta_ratio: 0.01
            warmup_iter: 5
            warmup_ratio: 1e-3
            warmup: "linear"
            last_epoch: -1

        loss:
          name: "MultiHeadSegmentationLoss"
          params:
            loss_function_name:
              "Chromsome":
                name: "pytorch_CrossEntropyLoss"
                params: null
              "Overlap": 
                name: "pytorch_BCEWithLogitsLoss"
                params: null
            weighted_loss: [2.0, 1.0]

        gradient_accumulation_steps: 1
        max_grad_norm: 1.0
        fp16_scaler: false
        local_rank: 1
        seed: 42
        rank: null
        gpu: [0, 1]
        world_size: null
        dist_url: "env://"
        backend: "nccl"

    MultiHeadTrainGenerator:
      config:
        epochs: 200
        train_data_dir: "<path_to_train_data>"
        val_data_dir: "<path_to_val_data>"
        dataset: "Instance_segmentation_touch_overlap"

        equalization_method: null

        num_workers: 30        
        is_grayscale: true

        transformation:
          train:
            Resize:
              height: 224
              width: 224
              image_interpolation: "LINEAR"
              mask_interpolation: "NEAREST"

            HorizontalFlip:
              p: 0.5
            VerticalFlip:
              p: 0.5
            RandomRotate90:
              p: 0.5
            OneOf:
              transforms:
                - GaussNoise: {
                  std_range: [0.04, 0.2]
                }
                - GaussianBlur: {}
                - MotionBlur: {}
              p: 0.25
            CoarseDropout:
              num_holes_range: [1, 1]
              hole_width_range: [12, 12]
              hole_height_range: [12, 12]
              p: 0.25
            Normalize:
              mean: [0.485, 0.456, 0.406]
              std: [0.229, 0.224, 0.225]
              
            ToTensorV2: {}
          
          val:
            Resize:
              height: 224
              width: 224
              image_interpolation: "LINEAR"
              mask_interpolation: "NEAREST"
            Normalize:
              mean: [0.485, 0.456, 0.406]
              std: [0.229, 0.224, 0.225]
            ToTensorV2: {}
        batch_size:
          train: 16
          val: 32
