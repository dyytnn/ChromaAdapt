builder: evaluate_segmentation
cfg:
  pipeline:
    ModelBuilding:
      is_evaluation: true
      config:
        task: "MassNet"
        architecture_config: "configs/yamlconfig/MassNet/Chromosome_MassNet.yaml"
        save_folder: "outputs/evaluation/real"
        is_validate: false

    EvaluateSegmentation:
      config:
        device: "cuda:1"
        model_path: "<path_to_model_weights>"

        dataset: Instance_Segmentation_Non_Classify
        data_dir: "<path_to_real_data>"

        ignore_background: false

        equalization_method: null
        batch_size: 16
        num_workers: 10

        from_domain_adaptation: true

        transformation:
          Resize:
            height: 224
            width: 224
            image_interpolation: "LINEAR"
            mask_interpolation: "NEAREST"
          Normalize:
            mean: [0.485, 0.456, 0.406]
            std: [0.229, 0.224, 0.225]

          ToTensorV2: {}
