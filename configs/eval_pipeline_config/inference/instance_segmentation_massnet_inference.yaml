builder: evaluate_segmentation
cfg:
  pipeline:
    ModelBuilding:
      is_evaluation: true
      config:
        task: "MassNet"
        architecture_config: "configs/yamlconfig/MassNet/Chromosome_MassNet.yaml"
        save_folder: "outputs/inference"
        is_validate: true
    
    Inference:
      config:
        device: "cuda:1"
        model_path: "<path_to_model_weights>"

        Dataset:
          provider: REAL

          REAL:
            dataset: DANNRealDataset
            data_dir: "<path_to_real_data>"

          SYNTHETIC:
            dataset: Instance_segmentation_touch_overlap
            data_dir: "<path_to_synthetic_data>"
        
        equalization_method: null
        batch_size: 16
        num_workers: 10

        from_domain_adaptation: false

        inference_mode: "both"

        transformation:
          Resize:
            height: 224
            width: 224
            image_interpolation: "LINEAR"
            mask_interpolation: "NEAREST"
          Normalize:
            mean: [0.485, 0.456, 0.406]
            std: [0.229, 0.224, 0.225]
          ToTensorV2: {}
    
